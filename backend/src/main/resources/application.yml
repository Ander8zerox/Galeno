# Cada propiedad se sobrescribe con su variable de entorno estándar de Spring, p. ej.
# spring.datasource.url -> SPRING_DATASOURCE_URL, app.ai.provider -> APP_AI_PROVIDER,
# app.security.jwt.secret -> APP_SECURITY_JWT_SECRET (en AWS, desde SSM Parameter Store).
spring:
  application:
    name: galeno-api
  datasource:
    url: jdbc:mysql://localhost:3317/galeno?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC
    username: galeno
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # el esquema lo manda Flyway, nunca Hibernate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 50MB # documentos clínicos: 20 MB (lo valida HistoriaService); RIPS en ZIP: 50 MB
      max-request-size: 60MB
  web:
    locale: es
    locale-resolver: fixed # mensajes de validación siempre en español

server:
  port: 8090
  shutdown: graceful
  # X-Forwarded-Proto: detrás de Caddy (TLS del origen) la API debe saber que la petición llegó por HTTPS, o anuncia
  # http:// (p. ej. en WWW-Authenticate). Tomcat solo cree los X-Forwarded-* que vienen de la red interna de Docker,
  # es decir de Caddy, que los arma él mismo; nunca los de afuera. La IP del visitante la sigue resolviendo
  # shared.web.IpCliente, solo para peticiones que traen el secreto de origen de CloudFront.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: '172\.(1[6-9]|2[0-9]|3[0-1])\.\d{1,3}\.\d{1,3}'

app:
  documentos:
    almacen: disco         # disco (desarrollo) | s3 (AWS): APP_DOCUMENTOS_ALMACEN
    dir: ./data/documentos # solo con disco
    bucket: ""             # solo con s3: APP_DOCUMENTOS_BUCKET (lo crea Terraform)
    region: us-east-2 # la región del proyecto de AWS (nueva experiencia): todo recurso regional va aquí
    endpoint: ""           # vacío en AWS; solo para probar en local con MinIO
  plataforma:
    operadores: "" # correos de las cuentas con acceso a la consola: APP_PLATAFORMA_OPERADORES (separados por coma)
  partners:
    comision-porcentaje: 20      # sobre cada pago aprobado de un consultorio referido, mientras siga pagando
    descuento-porcentaje: 10     # para el consultorio referido, en todos sus pagos
    minimo-liquidacion: 30000    # pesos: por debajo, las comisiones disponibles se acumulan
    retencion-dias: 30           # una comisión se puede pagar 30 días después del pago (por si se reversa)
  correo:
    proveedor: local # local (buzón de desarrollo en /api/v1/dev/buzon) | ses (en AWS)
    # Solo con ses (los valores reales los pone Terraform en el entorno):
    remitente: ""          # APP_CORREO_REMITENTE, p. ej. "Galenum <no-responder@galenum.com.co>"
    configuration-set: ""  # APP_CORREO_CONFIGURATION_SET: publica rebotes y quejas en SNS
    cola-eventos: ""       # APP_CORREO_COLA_EVENTOS: URL de la cola SQS suscrita a ese SNS
    region: us-east-2 # la región del proyecto de AWS (nueva experiencia): todo recurso regional va aquí
  soporte: # los mismos valores en frontend/src/soporte.ts
    correo: soporte@galenum.com.co # se reenvía al buzón del equipo (MX en infra/correo.tf)
    whatsapp: "" # p. ej. 573001234567; vacío, no se muestra
  web:
    base-url: http://localhost:5180 # para los enlaces de invitación; en AWS, el dominio de CloudFront
    origen-secreto: ""  # APP_WEB_ORIGEN_SECRETO: el encabezado X-Origen-Galeno que agrega CloudFront (vacío = sin CloudFront)
  security:
    jwt:
      secret: "" # obligatorio: APP_SECURITY_JWT_SECRET (mínimo 32 bytes)
      issuer: galeno-api
      ttl: 8h
  mfa:
    clave: "" # obligatorio: APP_MFA_CLAVE (mínimo 32 caracteres). Cifra los secretos TOTP: no se rota (ver identidad.CifradoMfa)
  ai:
    provider: fake            # fake | bedrock
    # Un modelo por función. Haiku 5.5 es el más económico (unas 40 veces menos que Opus); si la calidad del apoyo
    # diagnóstico no alcanza, se sube solo ese a Sonnet: APP_AI_MODEL_DIAGNOSTICO=anthropic.claude-sonnet-5-5
    model-formula: anthropic.claude-haiku-5-5
    model-diagnostico: anthropic.claude-haiku-5-5
    max-tokens: 8000
    effort: medium
    worker-concurrency: 4
    worker-poll-ms: 1000

springdoc:
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    # El contenedor no trae las 14 fuentes base de PDF y PDFBox avisa con 13 WARN por cada PDF que usa LiberationSans en
    # su lugar: el PDF sale bien, es ruido.
    org.apache.pdfbox.pdmodel.font.PDType1Font: ERROR
